name: Nightly

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
