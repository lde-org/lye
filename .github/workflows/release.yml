name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package.json

      - name: Install the extension toolchain
        run: npm i
        working-directory: editors/vscode

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath "$RUNNER_TEMP"/vsix/*.vsix
        working-directory: editors/vscode
